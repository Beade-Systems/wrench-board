<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="library.offline.page_title">Offline boards · Wrench Board</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/pcb_library.css"><link rel="stylesheet" href="/styles/settings.css"><script type="module" src="/js/offline.js"></script></head><body><header class="app-header"><a class="brand" href="/library.html">← Wrench Board</a><span data-i18n="library.offline.header">Offline boards</span></header><main class="settings"><h1 data-i18n="library.offline.heading">Your saved boards</h1><p data-i18n="library.offline.intro">These copies live in this browser. New original files and AI diagnostics need the backend.</p><label data-i18n-node="library.offline.board">Board<select id="boards"></select></label><div class="row"><button id="remove" data-i18n="library.offline.remove">Delete offline copy</button><button id="fit" data-i18n="library.offline.fit">Fit</button><select id="side" aria-label="Board side" data-i18n-attr="aria-label:library.offline.side_aria"><option value="3" data-i18n="library.offline.side_both">Both sides</option><option value="1" data-i18n="library.offline.side_top">Top side</option><option value="2" data-i18n="library.offline.side_bottom">Bottom side</option></select></div><label data-i18n-node="library.offline.search">Find component<input id="search" placeholder="For example U1" data-i18n-attr="placeholder:library.offline.search_placeholder"></label><p id="offline-status" role="status"></p><div style="height:60vh;position:relative"><canvas id="canva
